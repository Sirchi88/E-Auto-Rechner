<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>E-Auto-Rechner</title>
  <meta name="description" content="Amortisierungsrechner: Kosten eines E-Autos im Vergleich zum Verbrenner oder eigenen Auto – mit Break-even, Kfz-Steuer und regionalen Spritpreisen.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1110" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./" aria-label="E-Auto-Rechner, Startseite">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <span>E-Auto-Rechner</span>
      </a>
      <div class="actions">
        <button id="theme-btn" class="icon-btn" type="button" aria-label="Farbschema wechseln">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
        </button>
        <details id="menu" class="menu">
          <summary class="icon-btn" aria-label="Menü">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 7h16v2H4zm0 4h16v2H4zm0 4h16v2H4z"/></svg>
          </summary>
          <div class="menu-pop" role="menu">
            <button type="button" role="menuitem" id="act-export">Daten exportieren (JSON)</button>
            <button type="button" role="menuitem" id="act-import">Daten importieren …</button>
            <button type="button" role="menuitem" id="act-wizard">Assistent neu starten</button>
            <button type="button" role="menuitem" id="act-reset" class="danger">Alles zurücksetzen</button>
          </div>
        </details>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <noscript><p class="card">Bitte JavaScript aktivieren – der Rechner läuft vollständig in Ihrem Browser.</p></noscript>
  </main>
  <footer class="foot">
    <p>Keine Anmeldung, kein Server: Ihre Eingaben bleiben im Browser (localStorage). Alle Angaben ohne Gewähr.</p>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
